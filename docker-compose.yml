version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fivebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fivebot
      POSTGRES_USER: fivebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fivebot_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fivebot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fivebot -d fivebot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & State Management
  redis:
    image: redis:7-alpine
    container_name: fivebot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fivebot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fivebot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fivebot:${POSTGRES_PASSWORD:-fivebot_secure_password}@postgres:5432/fivebot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL:-http://localhost:8000/auth/discord/callback}
      PROCESS_TYPE: api
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fivebot_network

  # Worker Process (Queue processing)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fivebot_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fivebot:${POSTGRES_PASSWORD:-fivebot_secure_password}@postgres:5432/fivebot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-min-32-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PROCESS_TYPE: worker
    command: npm run start:worker
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
      - ./bot-template:/bot-template
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - fivebot_network

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fivebot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production}
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - fivebot_network

  # Main Bot Manager (optional - for management commands)
  bot-manager:
    build:
      context: ./bot-manager
      dockerfile: Dockerfile
    container_name: fivebot_manager
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fivebot:${POSTGRES_PASSWORD:-fivebot_secure_password}@postgres:5432/fivebot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISCORD_BOT_TOKEN: ${BOT_MANAGER_TOKEN}
      BACKEND_URL: http://backend:8000
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./bot-manager:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - fivebot_network
    profiles:
      - with-bot-manager

networks:
  fivebot_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
